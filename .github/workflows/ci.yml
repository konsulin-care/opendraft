name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2

      - run: mise install

      - run: pnpm install --frozen-lockfile

      - name: Install rapper (RDF parser)
        run: sudo apt-get update && sudo apt-get install -y rapper

      - name: Validate TTL files
        run: mise run validate-ttl

      - name: Run linter
        run: mise run lint

      - name: Run type checker
        run: mise run typecheck

      - name: Run conformance tests
        run: mise run test
