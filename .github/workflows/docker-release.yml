# Build and publish the container image to GitHub Container Registry (ghcr.io).
#
# Trigger: a GitHub Release is published, normally created by hand through the
# GitHub UI with a tag of the form vX.Y.Z. The tag is validated first, so a
# release tagged v1.2.3-rc.1 (prerelease suffix) is skipped instead of pushing.
#
# No test gating: master CI has already validated the tagged commit.
# Image scanning (Trivy) is deliberately deferred; only SBOM and provenance
# attestations are attached here.
name: Docker Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      valid: ${{ steps.tag.outputs.valid }}
    steps:
      - name: Check the tag matches vX.Y.Z
        id: tag
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag '$TAG' is not vX.Y.Z; skipping the image build."
            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and push
    needs: validate
    if: needs.validate.outputs.valid == 'true'
    runs-on: ubuntu-latest
    # The Production environment holds COOLIFY_APP_UUID; COOLIFY_URL and
    # COOLIFY_TOKEN come from the organization secrets.
    environment: Production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trigger Coolify redeploy
        # Coolify pulls the freshly pushed image on deploy; a plain
        # application restart would reuse the running container instead.
        shell: bash
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          MAX_ATTEMPTS: "30"
          POLL_INTERVAL: "10"
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
              --header "Accept: application/json" \
              "$@"
          }

          echo "Triggering Coolify deployment for application ${COOLIFY_APP_UUID}..."
          deploy_response=$(api --request POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}")

          deployment_uuid=$(printf '%s' "$deploy_response" | jq -r '
            .deployment_uuid // .deployments[0].deployment_uuid // empty')

          if [ -z "$deployment_uuid" ]; then
            echo "::error::Coolify returned no deployment UUID: ${deploy_response}"
            exit 1
          fi
          echo "Deployment queued: ${deployment_uuid}"

          attempt=1
          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            sleep "$POLL_INTERVAL"
            status_response=$(api "${COOLIFY_URL}/api/v1/deployments/${deployment_uuid}")
            status=$(printf '%s' "$status_response" | jq -r '.status // empty')
            echo "Attempt ${attempt}/${MAX_ATTEMPTS}: status=${status}"

            case "$status" in
              finished)
                echo "::notice::Coolify deployment ${deployment_uuid} succeeded."
                exit 0
                ;;
              failed | cancelled)
                echo "::error::Coolify deployment ${deployment_uuid} ended as '${status}'."
                printf '%s' "$status_response" | jq -r '.logs // empty' || true
                exit 1
                ;;
            esac

            attempt=$((attempt + 1))
          done

          echo "::error::Coolify deployment ${deployment_uuid} did not finish in time."
          exit 1
